spring.application.name=tpg-squad

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crm}
spring.datasource.username=${DB_USER:crm_user}
spring.datasource.password=${DB_PASSWORD:crm_password}

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create}
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.ventas.base-url=${VENTAS_BASE_URL:https://two026-1c-tpg-squad-3.onrender.com}